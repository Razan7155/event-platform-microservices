server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**

        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/events/**

        - id: registration-service
          uri: lb://REGISTRATION-SERVICE
          predicates:
            - Path=/registrations/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka