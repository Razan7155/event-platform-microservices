name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature-user
      - feature-event
      - feature-registration
      - feature-discovery
      - feature-gateway
      - feature-frontend

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - event-service
          - registration-service
          - api-gateway
          - discovery-server

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build