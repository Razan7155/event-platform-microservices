name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature-user
      - feature-event
      - feature-registration

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - event-service
          - registration-service
          - api-gateway
          - discovery-server

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build service
        run: mvn clean package -DskipTests
        working-directory: ${{ matrix.service }}

  frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend