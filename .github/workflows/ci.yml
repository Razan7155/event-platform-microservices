name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature-user
      - feature-event
      - feature-registration

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - event-service
          - registration-service
          - api-gateway-service
          - service-discovery

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify files
        run: ls -R

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: mvn clean package -DskipTests

  frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build