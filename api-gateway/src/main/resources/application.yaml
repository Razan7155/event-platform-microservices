server:
  port: 8085

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**,/auth/**

        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/events/**

        - id: registration-service
          uri: http://localhost:8083
          predicates:
            - Path=/registrations/**
        eureka:
            client:
                service-url:
                     defaultZone: http://localhost:8761/eureka