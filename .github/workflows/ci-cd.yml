name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build Discovery Service
        run: |
          cd discovery-service
          mvn clean test package

      - name: Build User Service
        run: |
          cd user-service
          mvn clean test package

      - name: Build Event Service
        run: |
          cd event-service
          mvn clean test package

      - name: Build Registration Service
        run: |
          cd registration-service
          mvn clean test package

    
  frontend:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build React App
        run: |
          cd frontend
          npm run build